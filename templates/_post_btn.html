<form method="post" action="{{ url }}" class="d-inline"{% if confirm %} onsubmit="return confirm('{{ confirm|escapejs }}')"{% endif %}>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button class="btn btn-sm {{ cls|default:'btn-outline-danger' }}" title="{{ title }}"><i class="bi bi-{{ icon }}"></i>{% if text %} {{ text }}{% endif %}</button>
</form>
